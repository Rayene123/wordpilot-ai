<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 905" width="1560" height="905" role="img" aria-labelledby="t d">
  <title id="t">WordPilot DOCX editing and integrity pipeline</title>
  <desc id="d">Four zones: the original DOCX and its inspection, approved insert, replace and remove operations applied by fixed tools with package-preserving save, eight automated integrity checks against the original and the approved operations, and the resulting output statuses.</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrGrey" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1 { font-size: 22px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #4b5563; }
    .zone { font-size: 12.5px; font-weight: 700; fill: #1e40af; letter-spacing: 0.4px; }
    .t { font-size: 13px; font-weight: 700; fill: #1e40af; }
    .tg { font-size: 13px; font-weight: 700; fill: #374151; }
    .tw { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .b { font-size: 10.5px; fill: #374151; }
    .bw { font-size: 10.5px; fill: #ffffff; }
    .d { font-size: 10px; fill: #4b5563; }
    .grp { font-size: 10px; font-weight: 700; fill: #475569; letter-spacing: 0.6px; }
    .cn { font-size: 11px; font-weight: 700; fill: #1f2937; }
    .num { font-size: 10px; font-weight: 700; fill: #ffffff; }
    .lab { font-size: 10.5px; font-style: italic; fill: #475569; }
    .mono { font-family: Consolas, Menlo, "Courier New", monospace; }
    .proc { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
    .dec { fill: #eff6ff; stroke: #1e40af; stroke-width: 1.6; }
    .stop { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .ok { fill: #1d4ed8; stroke: #1e3a8a; stroke-width: 2; }
    .grpbox { fill: #ffffff; stroke: #bfdbfe; stroke-width: 1.2; }
    .zonebox { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .flow { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#arr); }
    .flowb { fill: none; stroke: #1d4ed8; stroke-width: 2.6; marker-end: url(#arrBlue); }
    .flowg { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 3; marker-end: url(#arrGrey); }
    .line { fill: none; stroke: #334155; stroke-width: 1.8; }
    .lineg { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 3; }
  </style>

  <rect width="1560" height="905" fill="#ffffff"/>

  <!-- Title and legend -->
  <text x="20" y="40" class="h1">WordPilot DOCX editing and integrity pipeline</text>
  <text x="20" y="62" class="sub">From the original document, through approved edits, to an automatically verified output.</text>
  <rect x="1060" y="28" width="16" height="12" rx="3" class="proc"/>
  <text x="1084" y="38" class="b">Process step</text>
  <path d="M1218 27 L1228 34 L1218 41 L1208 34 z" class="dec"/>
  <text x="1236" y="38" class="b">Decision</text>
  <rect x="1060" y="50" width="16" height="12" rx="3" class="ok"/>
  <text x="1084" y="60" class="b">Success path</text>
  <rect x="1208" y="50" width="16" height="12" rx="3" class="stop"/>
  <text x="1232" y="60" class="b">Failure or separate step</text>

  <!-- ============ Zone containers ============ -->
  <rect x="20" y="130" width="320" height="618" rx="8" class="zonebox"/>
  <text x="36" y="152" class="zone">A · ORIGINAL DOCUMENT</text>
  <rect x="370" y="130" width="430" height="618" rx="8" class="zonebox"/>
  <text x="386" y="152" class="zone">B · EDITING OPERATIONS</text>
  <rect x="830" y="130" width="400" height="618" rx="8" class="zonebox"/>
  <text x="846" y="152" class="zone">C · INTEGRITY VERIFICATION</text>
  <rect x="1260" y="130" width="280" height="618" rx="8" class="zonebox"/>
  <text x="1276" y="152" class="zone">D · OUTPUT</text>

  <!-- ============ Zone A ============ -->
  <rect x="36" y="170" width="288" height="90" rx="8" class="proc"/>
  <text x="180" y="194" text-anchor="middle" class="t">Original DOCX (baseline)</text>
  <text x="180" y="216" text-anchor="middle" class="b">Uploaded file stored under a host ID;</text>
  <text x="180" y="232" text-anchor="middle" class="b">no edit ever overwrites it</text>
  <path d="M180 260 V288" class="flow"/>

  <rect x="36" y="290" width="288" height="100" rx="8" class="proc"/>
  <text x="180" y="314" text-anchor="middle" class="t">Load and inspect</text>
  <text x="180" y="336" text-anchor="middle" class="b">python-docx opens the package; the</text>
  <text x="180" y="352" text-anchor="middle" class="b">inspector reads content without changing</text>
  <text x="180" y="368" text-anchor="middle" class="b">the file</text>
  <path d="M180 390 V418" class="flow"/>

  <rect x="36" y="420" width="288" height="120" rx="8" class="proc"/>
  <text x="180" y="444" text-anchor="middle" class="t">Structures it reads</text>
  <text x="180" y="466" text-anchor="middle" class="b">Paragraphs and runs, with styles</text>
  <text x="180" y="482" text-anchor="middle" class="b">Body and nested tables, in order</text>
  <text x="180" y="498" text-anchor="middle" class="b">Direct run formatting, alignment</text>
  <text x="180" y="514" text-anchor="middle" class="b">Inline images (counted)</text>

  <rect x="36" y="570" width="288" height="100" rx="8" class="stop"/>
  <text x="180" y="594" text-anchor="middle" class="tg">Outside inspection</text>
  <text x="180" y="616" text-anchor="middle" class="b">Header and footer content, fields,</text>
  <text x="180" y="632" text-anchor="middle" class="b">hyperlinks and shapes are not read as</text>
  <text x="180" y="648" text-anchor="middle" class="b">document content</text>

  <!-- ============ Zone B ============ -->
  <rect x="386" y="170" width="398" height="70" rx="8" class="proc"/>
  <text x="585" y="194" text-anchor="middle" class="t">Approved operation list</text>
  <text x="585" y="214" text-anchor="middle" class="b">Only operations the user approved are run;</text>
  <text x="585" y="229" text-anchor="middle" class="b">they are validated again before execution</text>
  <path d="M585 240 V260" class="flow"/>

  <rect x="386" y="262" width="398" height="84" rx="8" class="proc"/>
  <text x="585" y="286" text-anchor="middle" class="t">Custom document tools</text>
  <text x="585" y="308" text-anchor="middle" class="b">Fixed tools with host-bound file paths; no</text>
  <text x="585" y="324" text-anchor="middle" class="b">shell, path argument or arbitrary code</text>

  <!-- bracket from tools to the three operations -->
  <path d="M585 346 V357 M449 357 H721" class="line"/>
  <path d="M449 357 V370" class="flow"/>
  <path d="M585 357 V370" class="flow"/>
  <path d="M721 357 V370" class="flow"/>

  <rect x="386" y="372" width="126" height="90" rx="8" class="proc"/>
  <text x="449" y="392" text-anchor="middle" class="t">Insert</text>
  <text x="449" y="412" text-anchor="middle" class="b">Adds a paragraph</text>
  <text x="449" y="427" text-anchor="middle" class="b">beside a unique anchor</text>
  <text x="449" y="451" text-anchor="middle" class="d mono">insert_paragraph</text>

  <rect x="522" y="372" width="126" height="90" rx="8" class="proc"/>
  <text x="585" y="392" text-anchor="middle" class="t">Replace</text>
  <text x="585" y="412" text-anchor="middle" class="b">Changes exact target</text>
  <text x="585" y="427" text-anchor="middle" class="b">text in place</text>
  <text x="585" y="451" text-anchor="middle" class="d mono">replace_text</text>

  <rect x="658" y="372" width="126" height="90" rx="8" class="proc"/>
  <text x="721" y="392" text-anchor="middle" class="t">Remove</text>
  <text x="721" y="412" text-anchor="middle" class="b">Deletes one targeted</text>
  <text x="721" y="427" text-anchor="middle" class="b">paragraph, if safe</text>
  <text x="721" y="451" text-anchor="middle" class="d mono">remove_paragraph</text>

  <!-- bracket from operations to execution -->
  <path d="M449 462 V475 M585 462 V475 M721 462 V475 M449 475 H721" class="line"/>
  <path d="M585 475 V488" class="flow"/>

  <rect x="386" y="490" width="398" height="80" rx="8" class="proc"/>
  <text x="585" y="514" text-anchor="middle" class="t">Deterministic execution</text>
  <text x="585" y="536" text-anchor="middle" class="b">Run in order on one working copy, with no</text>
  <text x="585" y="552" text-anchor="middle" class="b">model involved; the first failure stops the run</text>
  <path d="M585 570 V586" class="flow"/>

  <rect x="386" y="588" width="398" height="80" rx="8" class="proc"/>
  <text x="585" y="612" text-anchor="middle" class="t">Package-preserving save</text>
  <text x="585" y="634" text-anchor="middle" class="b">Only word/document.xml is rewritten; every</text>
  <text x="585" y="650" text-anchor="middle" class="b">other package part is copied from the source</text>
  <path d="M585 668 V684" class="flow"/>

  <rect x="386" y="686" width="398" height="52" rx="8" class="ok"/>
  <text x="585" y="708" text-anchor="middle" class="tw">Edited DOCX (new, uniquely named file)</text>
  <text x="585" y="726" text-anchor="middle" class="bw">Unrelated content is expected to stay unchanged</text>

  <!-- ============ Zone C ============ -->
  <rect x="846" y="160" width="368" height="76" rx="8" class="dec"/>
  <text x="1030" y="182" text-anchor="middle" class="t">Compare against baseline</text>
  <text x="1030" y="202" text-anchor="middle" class="b">The edited output is compared with the original</text>
  <text x="1030" y="217" text-anchor="middle" class="b">and the approved operations; all else must match</text>
  <path d="M1030 236 V256" class="flow"/>

  <!-- Group 1 -->
  <rect x="846" y="258" width="368" height="98" rx="8" class="grpbox"/>
  <text x="858" y="274" class="grp">CONTENT</text>
  <circle cx="866" cy="298" r="9" fill="#1d4ed8"/><text x="866" y="302" text-anchor="middle" class="num">1</text>
  <text x="884" y="296" class="cn">Approved operation outcomes</text>
  <text x="884" y="310" class="d">Each approved edit has exactly its expected effect</text>
  <circle cx="866" cy="336" r="9" fill="#1d4ed8"/><text x="866" y="340" text-anchor="middle" class="num">2</text>
  <text x="884" y="334" class="cn">Paragraph text and order</text>
  <text x="884" y="348" class="d">Body and table-cell text and order match expected</text>

  <!-- Group 2 -->
  <rect x="846" y="364" width="368" height="98" rx="8" class="grpbox"/>
  <text x="858" y="380" class="grp">FORMATTING</text>
  <circle cx="866" cy="404" r="9" fill="#1d4ed8"/><text x="866" y="408" text-anchor="middle" class="num">3</text>
  <text x="884" y="402" class="cn">Paragraph formatting</text>
  <text x="884" y="416" class="d">Styles, alignment and direct run properties</text>
  <circle cx="866" cy="442" r="9" fill="#1d4ed8"/><text x="866" y="446" text-anchor="middle" class="num">5</text>
  <text x="884" y="440" class="cn">Table formatting</text>
  <text x="884" y="454" class="d">Table, row and cell properties unchanged</text>

  <!-- Group 3 -->
  <rect x="846" y="470" width="368" height="98" rx="8" class="grpbox"/>
  <text x="858" y="486" class="grp">STRUCTURE</text>
  <circle cx="866" cy="510" r="9" fill="#1d4ed8"/><text x="866" y="514" text-anchor="middle" class="num">4</text>
  <text x="884" y="508" class="cn">Table count and dimensions</text>
  <text x="884" y="522" class="d">Same tables, rows and columns as the original</text>
  <circle cx="866" cy="548" r="9" fill="#1d4ed8"/><text x="866" y="552" text-anchor="middle" class="num">6</text>
  <text x="884" y="546" class="cn">Section properties</text>
  <text x="884" y="560" class="d">Section settings are unchanged</text>

  <!-- Group 4 -->
  <rect x="846" y="576" width="368" height="98" rx="8" class="grpbox"/>
  <text x="858" y="592" class="grp">BINARY AND PACKAGE</text>
  <circle cx="866" cy="616" r="9" fill="#1d4ed8"/><text x="866" y="620" text-anchor="middle" class="num">7</text>
  <text x="884" y="614" class="cn">Inline images and binary hashes</text>
  <text x="884" y="628" class="d">Image references and image bytes match</text>
  <circle cx="866" cy="654" r="9" fill="#1d4ed8"/><text x="866" y="658" text-anchor="middle" class="num">8</text>
  <text x="884" y="652" class="cn">DOCX package integrity</text>
  <text x="884" y="666" class="d">Every part except document.xml is hash-identical</text>

  <path d="M1030 674 V690" class="flow"/>
  <rect x="846" y="692" width="368" height="44" rx="8" class="proc"/>
  <text x="1030" y="711" text-anchor="middle" class="t">Integrity report</text>
  <text x="1030" y="727" text-anchor="middle" class="b">Status, unexpected changes, unverified features</text>

  <!-- ============ Zone D ============ -->
  <path d="M1400 160 L1510 225 L1400 290 L1290 225 z" class="dec"/>
  <text x="1400" y="222" text-anchor="middle" class="t">Verification</text>
  <text x="1400" y="239" text-anchor="middle" class="b">result?</text>

  <!-- branches -->
  <path d="M1280 380 V601" class="lineg"/>
  <path d="M1280 493 H1328" class="flowg"/>
  <path d="M1280 601 H1328" class="flowg"/>
  <text x="1303" y="486" text-anchor="middle" class="lab">partial</text>
  <text x="1303" y="594" text-anchor="middle" class="lab">failed</text>

  <rect x="1330" y="330" width="204" height="100" rx="8" class="ok"/>
  <text x="1432" y="354" text-anchor="middle" class="tw">Verified DOCX</text>
  <text x="1432" y="374" text-anchor="middle" class="bw mono">completed_verified</text>
  <text x="1432" y="394" text-anchor="middle" class="bw">Download enabled in the web UI</text>
  <text x="1432" y="410" text-anchor="middle" class="bw">and delivered to the user</text>

  <rect x="1330" y="448" width="204" height="90" rx="8" class="proc"/>
  <text x="1432" y="470" text-anchor="middle" class="t">Partially verified</text>
  <text x="1432" y="488" text-anchor="middle" class="d mono">completed_partially_verified</text>
  <text x="1432" y="508" text-anchor="middle" class="b">Unverified features are listed;</text>
  <text x="1432" y="523" text-anchor="middle" class="b">no download in the web UI</text>

  <rect x="1330" y="556" width="204" height="90" rx="8" class="stop"/>
  <text x="1432" y="578" text-anchor="middle" class="tg">Integrity failed</text>
  <text x="1432" y="596" text-anchor="middle" class="d mono">integrity_failed</text>
  <text x="1432" y="616" text-anchor="middle" class="b">Output kept for diagnosis,</text>
  <text x="1432" y="631" text-anchor="middle" class="b">flagged unverified, no UI download</text>

  <rect x="1280" y="668" width="254" height="70" rx="8" class="stop"/>
  <text x="1407" y="690" text-anchor="middle" class="tg">Manual visual inspection</text>
  <text x="1407" y="709" text-anchor="middle" class="b">A separate human step, not part of</text>
  <text x="1407" y="724" text-anchor="middle" class="b">the automated verification</text>

  <!-- ============ Inter-zone flows (drawn after containers) ============ -->
  <!-- source document enters the editing workflow -->
  <path d="M324 330 H384" class="flow"/>
  <!-- original = baseline, routed over the top -->
  <path d="M324 215 H355 V108 H1190 V158" class="flow"/>
  <text x="770" y="102" text-anchor="middle" class="lab">original DOCX is the integrity baseline</text>
  <!-- approved operations are the expected changes -->
  <path d="M784 205 H844" class="flow"/>
  <!-- edited output goes to the verifier -->
  <path d="M784 712 H815 V225 H844" class="flow"/>
  <!-- report to decision, then success path -->
  <path d="M1214 714 H1245 V225 H1288" class="flowb"/>
  <path d="M1400 290 V312 H1280 V380 H1328" class="flowb"/>
  <text x="1303" y="373" text-anchor="middle" class="lab" style="fill:#1e40af">passed</text>

  <!-- ============ Scope notes ============ -->
  <rect x="20" y="772" width="490" height="112" rx="8" class="stop"/>
  <text x="36" y="796" class="tg">Automated, structural verification</text>
  <text x="36" y="818" class="b">Checks structure and package contents only. There is no pixel-level</text>
  <text x="36" y="834" class="b">comparison, and identical rendering in Word, LibreOffice or other</text>
  <text x="36" y="850" class="b">word processors is not guaranteed.</text>

  <rect x="535" y="772" width="490" height="112" rx="8" class="stop"/>
  <text x="551" y="796" class="tg">Manual inspection is separate</text>
  <text x="551" y="818" class="b">A person opening the output in a word processor is a separate step.</text>
  <text x="551" y="834" class="b">It complements the automated report and is not part of it.</text>

  <rect x="1050" y="772" width="490" height="112" rx="8" class="stop"/>
  <text x="1066" y="796" class="tg">Bounded feature support</text>
  <text x="1066" y="818" class="b">Insert, replace and remove cover body and table-cell paragraphs.</text>
  <text x="1066" y="834" class="b">Tracked changes, fields, hyperlinks, shapes and similar OOXML</text>
  <text x="1066" y="850" class="b">features are reported as unverified, not guaranteed.</text>
</svg>
