<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1125" width="1400" height="1125" role="img" aria-labelledby="t d">
  <title id="t">WordPilot execution flow</title>
  <desc id="d">FastAPI plans a proposal and requires human approval. On approval it invokes compiled LangGraph to inspect, validate, edit with fixed DOCX tools, verify integrity, and finalize. Only passing verification can be downloaded.</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrGrey" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1 { font-size: 22px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #4b5563; }
    .zone { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.4px; }
    .sec { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing: 0.3px; }
    .secg { font-size: 13px; font-weight: 700; fill: #374151; letter-spacing: 0.3px; }
    .t { font-size: 13px; font-weight: 700; fill: #1e40af; }
    .tg { font-size: 13px; font-weight: 700; fill: #374151; }
    .b { font-size: 10.5px; fill: #374151; }
    .lab { font-size: 10.5px; font-style: italic; fill: #475569; }
    .mono { font-family: Consolas, Menlo, "Courier New", monospace; }
    .pill { font-size: 10px; fill: #1e40af; }
    .proc { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
    .dec { fill: #eff6ff; stroke: #1e40af; stroke-width: 1.6; }
    .stop { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .flow { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#arr); }
    .flowb { fill: none; stroke: #1d4ed8; stroke-width: 2.4; marker-end: url(#arrBlue); }
    .flowg { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 3; marker-end: url(#arrGrey); }
  </style>

  <rect width="1400" height="1125" fill="#ffffff"/>

  <!-- Title and legend -->
  <text x="40" y="40" class="h1">WordPilot execution flow: from request to verified result</text>
  <text x="40" y="62" class="sub">A shows the API and approval boundary. B expands the compiled graph used for approved execution.</text>
  <rect x="960" y="28" width="16" height="12" rx="3" class="proc"/>
  <text x="984" y="38" class="b">Process step</text>
  <path d="M1128 27 L1138 34 L1128 41 L1118 34 z" class="dec"/>
  <text x="1146" y="38" class="b">Decision</text>
  <rect x="960" y="50" width="16" height="12" rx="3" class="stop"/>
  <text x="984" y="60" class="b">Stop or failure outcome</text>
  <rect x="1118" y="50" width="16" height="12" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="1142" y="60" class="b">Approval boundary</text>

  <!-- ============ Section A ============ -->
  <rect x="20" y="80" width="1360" height="736" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="40" y="103" class="sec">A · FASTAPI PATH   plan_document() → human approval → execute_approved_proposal() → compiled LangGraph</text>

  <!-- Zone 1: plan -->
  <rect x="32" y="118" width="1336" height="222" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="138" class="zone">1 · PLAN: read-only, no output file is written</text>

  <rect x="48" y="180" width="220" height="110" rx="8" class="proc"/>
  <text x="158" y="214" text-anchor="middle" class="t">User request</text>
  <text x="158" y="238" text-anchor="middle" class="b">Editing instruction plus the</text>
  <text x="158" y="254" text-anchor="middle" class="b">uploaded DOCX (up to 15 MiB)</text>

  <path d="M268 235 H300" class="flow"/>

  <rect x="302" y="180" width="240" height="110" rx="8" class="proc"/>
  <text x="422" y="214" text-anchor="middle" class="t">Planning</text>
  <text x="422" y="238" text-anchor="middle" class="b">Inspects the DOCX; an LLM planner</text>
  <text x="422" y="254" text-anchor="middle" class="b">(Groq or Ollama) reads the instruction</text>

  <path d="M542 235 H574" class="flow"/>

  <rect x="576" y="180" width="240" height="110" rx="8" class="proc"/>
  <text x="696" y="214" text-anchor="middle" class="t">Operation proposal</text>
  <text x="696" y="238" text-anchor="middle" class="b">Typed replace / insert / remove</text>
  <text x="696" y="254" text-anchor="middle" class="b">operations, or a request to clarify</text>

  <path d="M816 235 H848" class="flow"/>

  <path d="M850 235 L960 165 L1070 235 L960 305 z" class="dec"/>
  <text x="960" y="219" text-anchor="middle" class="t">Validation</text>
  <text x="960" y="238" text-anchor="middle" class="b">Schema + exact targets</text>
  <text x="960" y="254" text-anchor="middle" class="b">valid?</text>

  <path d="M1070 235 H1104" class="flowg"/>
  <text x="1087" y="226" text-anchor="middle" class="lab">no</text>

  <rect x="1106" y="180" width="250" height="110" rx="8" class="stop"/>
  <text x="1231" y="214" text-anchor="middle" class="tg">Blocked: no edit is made</text>
  <text x="1231" y="238" text-anchor="middle" class="b">needs_clarification, unsupported,</text>
  <text x="1231" y="254" text-anchor="middle" class="b">failed or too_large (no operations)</text>

  <!-- Approval boundary band -->
  <rect x="32" y="352" width="1336" height="140" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M75 422 L190 362 L305 422 L190 482 z" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="190" y="406" text-anchor="middle" class="t">Human approval</text>
  <text x="190" y="424" text-anchor="middle" class="b">user reviews exact proposal</text>
  <text x="190" y="440" text-anchor="middle" class="b">approve or reject?</text>

  <path d="M305 422 H343" class="flowg"/>
  <text x="324" y="413" text-anchor="middle" class="lab">no</text>
  <rect x="345" y="377" width="200" height="90" rx="8" class="stop"/>
  <text x="445" y="406" text-anchor="middle" class="tg">Rejected</text>
  <text x="445" y="428" text-anchor="middle" class="b">No edit and no output;</text>
  <text x="445" y="444" text-anchor="middle" class="b">source untouched</text>

  <text x="585" y="388" class="t" style="font-size:14px;fill:#1e3a8a">2 · HUMAN APPROVAL BOUNDARY: no edit can run without it</text>
  <text x="585" y="411" class="b">POST /approve returns the exact proposal with its one-time token; POST /reject discards it.</text>
  <text x="585" y="431" class="b">Blocked if the token is stale, the proposal text changed (HTTP 409) or the source file changed since planning.</text>
  <text x="585" y="451" class="b">The token is consumed before the first edit, so one approval cannot be replayed.</text>

  <!-- Zone 3: execute and verify -->
  <rect x="32" y="504" width="1336" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="524" class="zone">3 · EXECUTE AND VERIFY: host-controlled and deterministic; the source file is never overwritten</text>

  <rect x="48" y="553" width="280" height="130" rx="8" class="proc"/>
  <text x="188" y="582" text-anchor="middle" class="t">LangGraph execution</text>
  <text x="188" y="603" text-anchor="middle" class="b">Operations are validated again, then run</text>
  <text x="188" y="619" text-anchor="middle" class="b">through fixed tools (replace, insert, remove)</text>
  <text x="188" y="635" text-anchor="middle" class="b">into a new, uniquely named output file</text>
  <rect x="120" y="652" width="136" height="20" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="188" y="666" text-anchor="middle" class="pill mono">build_document_graph()</text>

  <path d="M328 618 H366" class="flow"/>

  <path d="M368 618 L448 563 L528 618 L448 673 z" class="dec"/>
  <text x="448" y="614" text-anchor="middle" class="b" style="font-weight:600">All operations</text>
  <text x="448" y="630" text-anchor="middle" class="b" style="font-weight:600">succeeded?</text>

  <path d="M528 618 H566" class="flow"/>
  <text x="547" y="609" text-anchor="middle" class="lab">yes</text>

  <rect x="568" y="553" width="280" height="130" rx="8" class="proc"/>
  <text x="708" y="582" text-anchor="middle" class="t">Integrity verification</text>
  <text x="708" y="607" text-anchor="middle" class="b">verify_document_integrity compares</text>
  <text x="708" y="623" text-anchor="middle" class="b">the output with the source and the</text>
  <text x="708" y="639" text-anchor="middle" class="b">approved operations; unexpected</text>
  <text x="708" y="655" text-anchor="middle" class="b">changes make the check fail</text>

  <path d="M848 618 H886" class="flow"/>

  <path d="M888 618 L968 563 L1048 618 L968 673 z" class="dec"/>
  <text x="968" y="614" text-anchor="middle" class="b" style="font-weight:600">Integrity</text>
  <text x="968" y="630" text-anchor="middle" class="b" style="font-weight:600">not failed?</text>

  <path d="M1048 618 H1128" class="flow"/>
  <text x="1089" y="598" text-anchor="middle" class="lab">passed</text>

  <rect x="1130" y="553" width="226" height="130" rx="8" class="proc"/>
  <text x="1243" y="582" text-anchor="middle" class="t">Final result</text>
  <text x="1243" y="605" text-anchor="middle" class="b">Edited DOCX with its status:</text>
  <text x="1243" y="621" text-anchor="middle" class="b">completed_verified only</text>
  <text x="1243" y="637" text-anchor="middle" class="b">with integrity status passed</text>
  <text x="1243" y="657" text-anchor="middle" class="b">then registered download ID</text>

  <!-- approval connectors, drawn last so containers do not cover them -->
  <path d="M960 305 V326 H190 V360" class="flowb"/>
  <text x="575" y="318" text-anchor="middle" class="lab">yes: exact proposal and one-time token are shown to the user</text>
  <path d="M190 482 V551" class="flowb"/>
  <text x="200" y="531" class="lab" style="fill:#1e40af">approved</text>

  <!-- failure outcomes -->
  <path d="M448 673 V718" class="flowg"/>
  <text x="458" y="700" class="lab">no</text>
  <rect x="338" y="720" width="220" height="70" rx="8" class="stop"/>
  <text x="448" y="740" text-anchor="middle" class="tg mono" style="font-size:12px">execution_failed</text>
  <text x="448" y="757" text-anchor="middle" class="b">Stops at the first failing operation;</text>
  <text x="448" y="772" text-anchor="middle" class="b">partial output kept, unverified</text>

  <path d="M968 673 V718" class="flowg"/>
  <text x="978" y="700" class="lab">no</text>
  <rect x="858" y="720" width="220" height="70" rx="8" class="stop"/>
  <text x="968" y="740" text-anchor="middle" class="tg mono" style="font-size:12px">integrity_failed</text>
  <text x="968" y="757" text-anchor="middle" class="b">No download ID is issued;</text>
  <text x="968" y="772" text-anchor="middle" class="b">output remains unverified</text>

  <!-- ============ Section B ============ -->
  <rect x="20" y="836" width="1360" height="250" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="40" y="859" class="secg">B · COMPILED LANGGRAPH GRAPH   build_document_graph(output_dir)   (invoked by execute_approved_proposal after approval)</text>
  <text x="40" y="878" class="sub">The LLM planner remains outside this post-approval graph. The graph receives the approved operations and controls editing, integrity verification, and finalization.</text>

  <rect x="62" y="930" width="62" height="30" rx="15" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
  <text x="93" y="949" text-anchor="middle" class="b mono" style="font-weight:700">START</text>
  <path d="M124 945 H145" class="flow"/>

  <rect x="148" y="905" width="205" height="88" rx="8" class="proc"/>
  <text x="250" y="930" text-anchor="middle" class="t mono" style="font-size:12px">inspect_document</text>
  <text x="250" y="953" text-anchor="middle" class="b">Inspects source and checks</text>
  <text x="250" y="970" text-anchor="middle" class="b">planning fingerprint</text>
  <path d="M353 949 H375" class="flow"/>

  <rect x="378" y="905" width="205" height="88" rx="8" class="proc"/>
  <text x="480" y="930" text-anchor="middle" class="t mono" style="font-size:12px">validate_operations</text>
  <text x="480" y="953" text-anchor="middle" class="b">Validates all approved edits</text>
  <text x="480" y="970" text-anchor="middle" class="b">before modification</text>
  <path d="M583 949 H605" class="flow"/>

  <rect x="608" y="905" width="205" height="88" rx="8" class="proc"/>
  <text x="710" y="930" text-anchor="middle" class="t mono" style="font-size:12px">execute_operations</text>
  <text x="710" y="953" text-anchor="middle" class="b">Fixed Python DOCX tools;</text>
  <text x="710" y="970" text-anchor="middle" class="b">unique output, stop on failure</text>
  <path d="M813 949 H835" class="flow"/>

  <rect x="838" y="905" width="205" height="88" rx="8" class="proc"/>
  <text x="940" y="930" text-anchor="middle" class="t mono" style="font-size:12px">verify_integrity</text>
  <text x="940" y="953" text-anchor="middle" class="b">Compares output with source</text>
  <text x="940" y="970" text-anchor="middle" class="b">and approved changes</text>
  <path d="M1043 949 H1065" class="flow"/>

  <rect x="1068" y="905" width="170" height="88" rx="8" class="proc"/>
  <text x="1153" y="930" text-anchor="middle" class="t mono" style="font-size:12px">finalize</text>
  <text x="1153" y="953" text-anchor="middle" class="b">Success only if checks</text>
  <text x="1153" y="970" text-anchor="middle" class="b">pass; otherwise failure</text>
  <path d="M1238 949 H1262" class="flow"/>

  <rect x="1264" y="930" width="62" height="30" rx="15" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
  <text x="1295" y="949" text-anchor="middle" class="b mono" style="font-weight:700">END</text>

  <rect x="354" y="1017" width="690" height="38" rx="8" class="stop"/>
  <text x="699" y="1041" text-anchor="middle" class="b">Conditional failure routes skip later work or successful finalization; unverified output gets no download ID.</text>
  <text x="40" y="1108" class="sub">Compiled graphs are reused by host output directory; each invoke carries isolated request state. The API registers downloads only for passed integrity verification.</text>
</svg>
